# Enable mouse support
set -g mouse on

# Change prefix to Ctrl-a
set -g prefix C-a
bind C-a send-prefix
unbind C-b

# set prefix \ to vertical split
bind \\ split-window -h
# set prefix - to horizontal split
bind - split-window -v

bind r source-file ~/.config/tmux/tmux.conf


# Set the default shell as fish
set -g default-shell /run/current-system/sw/bin/fish
set -g default-terminal "tmux-256color"
set -g status-interval 1


# Set the colorscheme
set -g status-style "bg=default,fg=colour39"
set -g status-left-style "bg=default,fg=colour198"
set -g status-right-style "bg=default,fg=colour198"

set -gq allow-passthrough on

# Make the unused space transparent
set -g status-bg "default"

# Customize the status line components
set -g status-left-length 51
set -g status-right-length 150
set -g status-interval 5
set -g status-left "#[fg=#a6e3a1,bg=default,bold]   #[fg=#f9e2af,bg=default,bold]#(whoami)  #[fg=#fab387,bg=default,bold]󰋃 #(bash -- ~/.config/tmux/scripts/session-name.sh #S) #(bash -- ~/.config/tmux/scripts/git_branch.sh #{pane_current_path})#[fg=default, bg=default,nobold] "
set -g status-right "#[fg=#6c7086,bg=default,bold]#(basename #{pane_current_path}) #[fg=#89b4fa,bg=default] #h  [#{?@devshell,#{@devshell},-}] #[fg=#b4befe,bg=default] %Y-%m-%d %H:%M   "
setw -g window-status-current-format "#[fg=#3e3e4e,bg=default]#[fg=#eba0ac,bg=#3e3e4e]#W#[fg=#3e3e4e,bg=default]"
setw -g window-status-format "#[fg=#f5cdcd,bg=default]#W"
set-option -g set-titles-string '#S'

set -g pane-border-style "fg=colour244 bg=default"
set -g pane-active-border-style "fg=colour234 bg=default"
